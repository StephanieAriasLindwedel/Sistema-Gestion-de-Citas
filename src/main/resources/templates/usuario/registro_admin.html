<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registro Usuario - Administrador</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <div th:replace="fragments/navbar :: navbar"></div>
        <div class="container-custom fade-in">
            <div class="page-header">
                <h1>Registro de Nuevo Usuario</h1>
                <p>Crear un nuevo usuario con el rol correspondiente</p>
            </div>
            <div class="card-custom">
                <div class="card-header-custom">
                    Información del usuario
                </div>
                <div class="card-body-custom">
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <div th:if="${exito}" class="alert alert-danger" th:text="${exito}"></div>
                    <form th:action="@{/usuario/admin/guardar}" th:object="${usuario}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <div style="display: grid; grid-template-columns: repeat(auto-fit,minmax(250px,1fr)); gap:1.5rem;">
                            <div class="form-group">
                                <label class="form-label">Nombre Completo</label>
                                <input type="text" th:field="*{nombre}" class="form-control" placeholder="Juan Mora Mora" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Cédula</label>
                                <input type="text" th:field="*{cedula}" class="form-control" placeholder="115226548" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Correo Electrónico</label>
                                <input type="email" th:field="*{correo}" class="form-control" placeholder="juanmora@ejemplo.com" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Teléfono de Contacto</label>
                                <input type="tel" th:field="*{contacto}" class="form-control" placeholder="8888-8888">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Contraseña *</label>
                                <input type="password" th:field="*{password}" class="form-control" placeholder="Mínimo 6 caracteres" required minlength="6">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Rol del Usuario</label>
                                <select th:field="*{rol}" class="form-control select-custom" required>
                                    <option value="USUARIO">USUARIO</option>
                                    <option value="ADMIN">ADMINISTRADOR</option>
                                </select>
                            </div>
                        </div>
                        <div class="alert alert-info mt-3">
                            <strong>NOTA:</strong> Los usuarios que tienen rol Administrador tendrán acceso completo al sistema.
                            Los usuarios con rol Usuario solo podrán ver y editar su perfil además de reservar espacios para citas.
                        </div>
                        <div class="flex-between mt-4">
                            <a th:href="@{/usuario/listaUsuarios}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Guardar Usuario</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
